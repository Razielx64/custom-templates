id: js-secrets-exposure

info:
  name: JavaScript Secrets & Tokens Exposure
  author: Razielx64
  severity: high
  description: Detects secrets, API keys, tokens and credentials leaked in JavaScript files
  tags: javascript,exposure,secrets,tokens,recon,misconfig
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/

requests:


  - method: GET
    path:
      - "{{BaseURL}}/main.js"
      - "{{BaseURL}}/app.js"
      - "{{BaseURL}}/index.js"
      - "{{BaseURL}}/bundle.js"
      - "{{BaseURL}}/vendor.js"
      - "{{BaseURL}}/chunk.js"
      - "{{BaseURL}}/runtime.js"
      - "{{BaseURL}}/config.js"
      - "{{BaseURL}}/env.js"
      - "{{BaseURL}}/settings.js"
      - "{{BaseURL}}/static/js/main.js"
      - "{{BaseURL}}/static/js/bundle.js"
      - "{{BaseURL}}/static/js/vendors.js"
      - "{{BaseURL}}/assets/js/app.js"
      - "{{BaseURL}}/assets/js/main.js"
      - "{{BaseURL}}/assets/application.js"
      - "{{BaseURL}}/js/app.js"
      - "{{BaseURL}}/js/main.js"
      - "{{BaseURL}}/js/config.js"
      - "{{BaseURL}}/dist/main.js"
      - "{{BaseURL}}/dist/bundle.js"
      - "{{BaseURL}}/dist/app.js"
      - "{{BaseURL}}/build/static/js/main.js"
      - "{{BaseURL}}/build/static/js/bundle.js"
      - "{{BaseURL}}/public/js/app.js"
      - "{{BaseURL}}/wp-content/themes/main.js"
      - "{{BaseURL}}/wp-includes/js/app.js"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
            - "AKIA[0-9A-Z]{16}"
            - "aws[_\\-\\.]?secret[_\\-\\.]?access[_\\-\\.]?key[\\s]*[=:]+[\\s]*[\"']?([A-Za-z0-9/+]{40})"
            - "AIza[0-9A-Za-z\\-_]{35}"
            - "\"type\":\\s*\"service_account\""
            - "gh[pousr]_[A-Za-z0-9_]{36,255}"
            - "github[_\\-\\.]?token[\\s]*[=:]+[\\s]*[\"']?([a-f0-9]{40})"
            - "(sk|pk)_(live|test)_[0-9a-zA-Z]{24,}"
            - "SK[0-9a-fA-F]{32}"
            - "AC[a-z0-9]{32}"
            - "SG\\.[a-zA-Z0-9\\-_]{22}\\.[a-zA-Z0-9\\-_]{43}"
            - "eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}"
            - "[\"']?api[_\\-\\.]?key[\"']?\\s*[=:]+\\s*[\"']([A-Za-z0-9\\-_]{16,64})[\"']"
            - "[\"']?secret[_\\-\\.]?key[\"']?\\s*[=:]+\\s*[\"']([A-Za-z0-9\\-_]{16,64})[\"']"
            - "[\"']?access[_\\-\\.]?token[\"']?\\s*[=:]+\\s*[\"']([A-Za-z0-9\\-_\\.]{16,})[\"']"
            - "[\"']?auth[_\\-\\.]?token[\"']?\\s*[=:]+\\s*[\"']([A-Za-z0-9\\-_\\.]{16,})[\"']"
            - "[\"']?private[_\\-\\.]?key[\"']?\\s*[=:]+\\s*[\"']([A-Za-z0-9\\-_\\.]{16,})[\"']"
        condition: or

      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "javascript"
          - "ecmascript"
        condition: or

    extractors:
      - type: regex
        part: body
        name: aws_key
        regex:
          - 'AKIA[0-9A-Z]{16}'

      - type: regex
        part: body
        name: google_api_key
        regex:
          - 'AIza[0-9A-Za-z\-_]{35}'

      - type: regex
        part: body
        name: github_token
        regex:
          - 'gh[pousr]_[A-Za-z0-9_]{36,255}'

      - type: regex
        part: body
        name: stripe_key
        regex:
          - '(sk|pk)_(live|test)_[0-9a-zA-Z]{24,}'

      - type: regex
        part: body
        name: jwt_token
        regex:
          - 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'

      - type: regex
        part: body
        name: sendgrid_key
        regex:
          - 'SG\.[a-zA-Z0-9\-_]{22}\.[a-zA-Z0-9\-_]{43}'

      - type: regex
        part: body
        name: generic_secret
        regex:
            - "[\"']?secret[_\\-\\.]?key[\"']?\\s*[=:]+\\s*[\"']([A-Za-z0-9\\-_]{16,64})[\"']"
            - "[\"']?api[_\\-\\.]?key[\"']?\\s*[=:]+\\s*[\"']([A-Za-z0-9\\-_]{16,64})[\"']"


  - method: GET
    path:
      - "{{BaseURL}}/main.js.map"
      - "{{BaseURL}}/bundle.js.map"
      - "{{BaseURL}}/app.js.map"
      - "{{BaseURL}}/vendor.js.map"
      - "{{BaseURL}}/static/js/main.js.map"
      - "{{BaseURL}}/static/js/bundle.js.map"
      - "{{BaseURL}}/build/static/js/main.js.map"
      - "{{BaseURL}}/dist/main.js.map"
      - "{{BaseURL}}/dist/bundle.js.map"
      - "{{BaseURL}}/assets/js/app.js.map"
      - "{{BaseURL}}/packs/js/application.js.map"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"sourceRoot"'
          - '"sources"'
          - '"mappings"'
          - '"sourcesContent"'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: source_paths
        regex:
          - '"sources":\["([^"]+)"'        # paths internos do servidor
          - '"sourceRoot":\s*"([^"]+)"'    # diretório raiz do código

      - type: regex
        part: body
        name: secrets_in_sourcemap
        regex:
          - 'AKIA[0-9A-Z]{16}'
          - 'AIza[0-9A-Za-z\-_]{35}'
          - 'gh[pousr]_[A-Za-z0-9_]{36,255}'
          - '(sk|pk)_(live|test)_[0-9a-zA-Z]{24,}'
          - 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
          - 'SG\.[a-zA-Z0-9\-_]{22}\.[a-zA-Z0-9\-_]{43}'


  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/index.html"
      - "{{BaseURL}}/app.html"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          # Next.js env público
          - 'NEXT_PUBLIC_[A-Z_]+=([^\s"&<]+)'
          # React env
          - 'REACT_APP_[A-Z_]+=([^\s"&<]+)'
          # window.__env / window.ENV pattern
          - 'window\.__env\s*=\s*\{[^}]+\}'
          - 'window\.ENV\s*=\s*\{[^}]+\}'
          # __NEXT_DATA__ injetado pelo Next.js
          - '"props":\{"pageProps":\{[^}]{50,}'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: nextjs_env
        regex:
          - 'NEXT_PUBLIC_[A-Z_0-9]+=([^\s"&<\\]+)'

      - type: regex
        part: body
        name: react_env
        regex:
          - 'REACT_APP_[A-Z_0-9]+=([^\s"&<\\]+)'

      - type: regex
        part: body
        name: window_env
        regex:
          - 'window\.__env\s*=\s*(\{[^}]+\})'
          - 'window\.ENV\s*=\s*(\{[^}]+\})'

      - type: regex
        part: body
        name: next_data
        regex:
          - 'id="__NEXT_DATA__"[^>]*>(\{.{50,}?\})</script>'


  - method: GET
    path:
      - "{{BaseURL}}/static/js/runtime-main.js"
      - "{{BaseURL}}/static/js/2.chunk.js"
      - "{{BaseURL}}/static/js/main.chunk.js"
      - "{{BaseURL}}/webpack-runtime.js"
      - "{{BaseURL}}/webpack.config.js"
      - "{{BaseURL}}/webpack.config.prod.js"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - 'AKIA[0-9A-Z]{16}'
          - 'AIza[0-9A-Za-z\-_]{35}'
          - 'gh[pousr]_[A-Za-z0-9_]{36,255}'
          - '(sk|pk)_(live|test)_[0-9a-zA-Z]{24,}'
          - 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
          - "[\"']?api[_\\-\\.]?key[\"']?\\s*[=:]+\\s*[\"']([A-Za-z0-9\\-_]{16,64})[\"']"
          - 'process\.env\.[A-Z_]+=([^\s"&<;]+)'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: process_env_leak
        regex:
          - 'process\.env\.([A-Z_0-9]+)\s*[=:]\s*"([^"]+)"'

      - type: regex
        part: body
        name: hardcoded_keys
        regex:
          - 'AKIA[0-9A-Z]{16}'
          - 'AIza[0-9A-Za-z\-_]{35}'
          - '(sk|pk)_(live|test)_[0-9a-zA-Z]{24,}'
          - 'SG\.[a-zA-Z0-9\-_]{22}\.[a-zA-Z0-9\-_]{43}'